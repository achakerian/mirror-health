name: Active Mirror Check

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:  # Manual trigger for testing

concurrency:
  group: mirror-health-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # The active check probes every Candidate/Alive/GOAT mirror with 1-5s polite
    # delays (~200 mirrors), so 5 min was always hit -> the job was cancelled
    # before it could commit, freezing promotions (yts/torrentgalaxy/rutracker
    # never left Candidate). Give it room to finish and push.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run active check
        run: python -m src.main active

      - name: Commit and push results
        run: |
          git config user.name "mirror-health-bot"
          git config user.email "mirror-health-bot@users.noreply.github.com"
          cp data/mirror_state.json /tmp/mirror_state.json
          cp data/mirror_scores.json /tmp/mirror_scores.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/mirror_state.json data/mirror_state.json
          cp /tmp/mirror_scores.json data/mirror_scores.json
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): update mirror health [active_check]"
            git push
          fi
